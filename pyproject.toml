[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hermes-agent"
version = "0.1.0"
description = "A staged learning reproduction of Hermes Agent."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tzdata>=2025.2",
]

[project.scripts]
mini-hermes = "hermes_cli.main:main"

[tool.setuptools]
py-modules = ["cli", "run_agent", "model_tools"]

[tool.setuptools.packages.find]
include = ["hermes_cli*", "agent*", "tools*"]
